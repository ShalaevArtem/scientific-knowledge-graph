# Полный стек: Neo4j + приложение (веб-UI/слой запросов).
#   docker compose up -d --build
# Требуется .env в корне (NEO4J_PASSWORD и LLM_* — см. .env.example).
# База поднимается пустой: инициализация — schema/seed/данные (см. README).
services:
  app:
    build: .
    image: skg-app:latest          # тег для публикации в реестр (GHCR/Docker Hub)
    depends_on:
      neo4j:
        condition: service_healthy  # стартуем только после готовности БД
    env_file:
      - .env                        # LLM_*, AUTH_TOKENS, NEO4J_USER/PASSWORD/DATABASE
    environment:
      # внутри compose Neo4j доступен по имени сервиса, а не localhost из .env
      NEO4J_URI: bolt://neo4j:7687
      PORT: "8000"
    ports:
      - "${APP_PORT:-8000}:8000"
    restart: unless-stopped

  neo4j:
    image: neo4j:2026.05.0-community
    ports:
      - "7474:7474"   # HTTP (браузер Neo4j)
      - "7687:7687"   # Bolt (драйверы)
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_max__size: 2G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./infra/neo4j-dump:/dump   # дамп для восстановления (см. infra/neo4j-dump/README.md)
    healthcheck:
      # значения подставляет compose из корневого .env (одинарный $), т.к. внутри
      # контейнера neo4j переменной NEO4J_PASSWORD нет — есть только NEO4J_AUTH
      test: ["CMD-SHELL", "cypher-shell -u ${NEO4J_USER:-neo4j} -p '${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}' 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  neo4j_data:
  neo4j_logs:
