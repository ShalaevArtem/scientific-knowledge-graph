# Развёртывание Neo4j для сервера/CI. Для локальной разработки без Docker
# используйте infra/neo4j-local/install.ps1 (Windows, zip-дистрибутив).
services:
  neo4j:
    image: neo4j:2026.05.0-community
    ports:
      - "7474:7474"   # HTTP (браузер Neo4j)
      - "7687:7687"   # Bolt (драйверы)
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_max__size: 2G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u $${NEO4J_USER:-neo4j} -p $${NEO4J_PASSWORD} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  neo4j_data:
  neo4j_logs:
