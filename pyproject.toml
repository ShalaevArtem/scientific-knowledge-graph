[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skg"
version = "0.1.0"
description = "Scientific knowledge graph: граф знаний по исследованиям (материалы, эксперименты, режимы, свойства)"
requires-python = ">=3.10"
dependencies = [
    "neo4j>=5.28",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "openpyxl>=3.1",
    "xlrd>=2.0.1",
    "pytesseract>=0.3.10",
    "pillow>=10.0",
    "fastembed>=0.5",
    "httpx>=0.27",
    "fastapi>=0.111",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.4",
]

[project.scripts]
skg = "skg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
skg = ["web/static/*"]

[tool.ruff]
line-length = 100
src = ["src"]
